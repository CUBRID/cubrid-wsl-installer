<style>
    /* Dark Mode: paint the entire viewport (including areas the body
       does not cover due to max-width / margin-left) so the gutter
       between TOC and body, the area beyond body's max-width, and the
       viewport below short pages all share the same dark background.
       'color-scheme: dark' also makes scrollbars, focus rings, and
       default form controls follow the dark theme. */
    html {
        background-color: #0d1117;
        color-scheme: dark;
    }

    body {
        /* Layout: replaced Grid with margin-based spacing */
        margin: 0;
        margin-left: 270px; /* TOC width (250px) + gutter (20px) */
        padding: 20px;
        max-width: 900px;
        min-height: 100vh;  /* Avoid white strip under short documents */
        
        /* Font & Base Style */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.6;

        /* Dark Mode: background and text */
        background-color: #0d1117; /* GitHub Dark Dimmed background color */
        color: #c9d1d9;           /* Default text color */
    }

    #TOC {
        /* Fixed sidebar */
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh; /* Full viewport height */
        overflow-y: auto;
        
        /* Dark Mode: sidebar style */
        background-color: #161b22;
        border-right: 1px solid #30363d;
        padding: 20px;
        box-sizing: border-box; /* Include padding in width calculation */
    }

    #TOC ul { list-style: none; padding-left: 20px; }
    #TOC > ul { padding-left: 0; }
    
    /* Dark Mode: link style */
    a { text-decoration: none; color: #58a6ff; }
    #TOC a { font-size: 14px; color: #8b949e; transition: color 0.2s; }
    #TOC a:hover { text-decoration: underline; color: #58a6ff; }
    
    /* Dark Mode: code block style */
    code { 
        background-color: #21262d; 
        padding: 0.2em 0.4em; 
        border-radius: 3px; 
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
    }
    pre { 
        background-color: #161b22; 
        padding: 16px; 
        overflow: auto; 
        border-radius: 6px; 
        border: 1px solid #30363d;
    }

    /* Table style (added) */
    table { border-collapse: collapse; margin: 1em 0; }
    th, td { border: 1px solid #30363d; padding: 8px; }
    th { background-color: #21262d; }
</style>
